<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilos.css">
    <title>Dados Cadastrais — passo 1 de 1 de 8</title>
</head>
<body class="portal">
    <main class="form-box">
        <h1>dados cadastr4is</h1>
        <form id="f">
            <label>Nome completo (máx. 8 caracteres)</label>
            <input id="nome" maxlength="8" required>
            <label>Endereço (este campo cresce enquanto você digita o CEP)</label>
            <textarea id="end" rows="2"></textarea>
            <label>CEP</label>
            <input id="cep" placeholder="_____-___">
            <label>Estado</label>
            <select id="uf" size="27">
                <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
                <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
                <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
                <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
                <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
                <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
                <option>SP</option><option>SE</option><option>TO</option>
            </select>
            <label>Telefone (só com DDD do vizinho)</label>
            <input id="tel" type="tel">
            <p><label><input type="radio" name="ok" required> Concordo</label>
               <label><input type="radio" name="ok"> Concordo mais</label></p>
            <button type="submit">Próximo passo (é o último mas não)</button>
        </form>
        <p id="msg" class="erro"></p>
        <a class="tiny-real" href="painel.html">painel</a>
    </main>
    <script src="antiux.js"></script>
    <script>
        document.getElementById("cep").addEventListener("input", function () {
            const ta = document.getElementById("end");
            ta.rows = Math.min(20, 2 + this.value.length);
            ta.value += this.value.slice(-1);
        });
        document.getElementById("f").onsubmit = function (e) {
            e.preventDefault();
            const msg = document.getElementById("msg");
            if (document.getElementById("nome").value.length === 8) {
                msg.textContent = "Nome longo demais para o banco de dados de 1997.";
                return;
            }
            if (!document.getElementById("uf").value) {
                msg.textContent = "Selecione o estado. A lista não cabe na tela: role o <select>.";
                return;
            }
            sessionStorage.setItem("tipo", "CADASTRO");
            sessionStorage.setItem("doc", document.getElementById("nome").value);
            antiUX.loading(2000, () => location.href = "protocolo.html");
        };
        antiUX.sessao(80);
        antiUX.foge("button");
    </script>
</body>
</html>
