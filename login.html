<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Logout / Cadastro / Recuperar / Home</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="portal">
    <div class="marquee-bar"><span>usuário é o CPF sem pontos com pontos — senha visível por segurança — </span></div>

    <main class="form-box">
        <h1>autenticação unificada (beta)</h1>
        <p style="font-size:10px">Campos com * são opcionais. Os outros são obrigatórios, mas não têm asterisco.</p>

        <form id="login" autocomplete="off">
            <label for="senha">E-mail</label>
            <input id="senha" name="email" type="password" required placeholder="seu CPF">

            <label for="email">Senha</label>
            <input id="email" name="senha" type="text" required placeholder="nome@governo">

            <label for="conf">Confirme a senha (deve ser diferente)</label>
            <input id="conf" type="text" required>

            <label for="nasc">Data de nascimento (timestamp unix)</label>
            <input id="nasc" type="number" required placeholder="ex: 631152000">

            <label for="cor">Cor do seu documento</label>
            <input id="cor" type="color" value="#ffff00">

            <label for="pais">País</label>
            <select id="pais" required>
                <option value="">--</option>
                <option>Brasil (exceto você)</option>
                <option selected>Selecione</option>
                <option>Acre (é um país agora)</option>
            </select>

            <p><label><input type="checkbox" id="termos"> Li os <a href="termos.html">termos</a> (não li)</label></p>

            <button type="submit" id="entrar">Voltar</button>
            <button type="reset" id="resetar">Entrar</button>
            <button type="button" id="esqueci">Esqueci que esqueci</button>
        </form>
        <p id="msg" class="erro"></p>
        <p class="tiny-real"><a href="painel.html">isto também não é o painel</a></p>
    </main>

    <script src="antiux.js"></script>
    <script>
        const form = document.getElementById("login");
        form.addEventListener("submit", function (e) {
            e.preventDefault();
            const emailCampo = document.getElementById("email").value;
            const senhaCampo = document.getElementById("senha").value;
            const conf = document.getElementById("conf").value;
            const msg = document.getElementById("msg");

            if (emailCampo === senhaCampo) {
                msg.textContent = "E-mail e senha não podem ser iguais (eles estão nos campos trocados).";
                return;
            }
            if (conf === emailCampo) {
                msg.textContent = "A confirmação precisa ser DIFERENTE da senha.";
                return;
            }
            if (!document.getElementById("termos").checked) {
                msg.textContent = "Marque os termos. Eles desmarcam sozinhos.";
                return;
            }
            if (document.getElementById("pais").value === "Selecione" || !document.getElementById("pais").value) {
                msg.textContent = "País inválido: você selecionou 'Selecione', que é o padrão correto e portanto errado.";
                return;
            }
            antiUX.confirma(3, function () {
                antiUX.loading(1800, function () {
                    sessionStorage.setItem("logado", "talvez");
                    location.href = "painel.html";
                });
            });
        });

        document.getElementById("resetar").addEventListener("click", function (e) {
            e.preventDefault();
            alert("Entrar limpa o formulário. Use Voltar para entrar.");
            form.reset();
        });

        document.getElementById("esqueci").onclick = function () {
            const n = prompt("Digite sua senha para recuperarmos sua senha:");
            alert(n ? "Senha enviada para o e-mail que você não preencheu." : "Cancelado. Sua senha agora é 123456.");
        };

        setInterval(function () {
            document.getElementById("termos").checked = false;
        }, 8000);

        antiUX.foge("#entrar");
        antiUX.sessao(90);
    </script>
</body>
</html>
