<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilos.css">
    <title>Consulta CPF — digite com o mouse</title>
</head>
<body class="portal">
    <div class="marquee-bar"><span>CPF deve ser digitado de trás pra frente — um dígito por caixa — tab ordem: aleatória — </span></div>
    <main class="form-box">
        <h1>consultar cpf</h1>
        <p style="font-size:9px">Informe o CPF. Não usamos máscara. Usamos 11 campos invertidos.</p>
        <form id="f">
            <div class="grid-cpf" id="grid"></div>
            <label for="nome">Nome da mãe (do CPF)</label>
            <input id="nome" type="text" required>
            <label for="motivo">Motivo da consulta</label>
            <select id="motivo">
                <option>Outro</option>
                <option>Outro (especifique em outro)</option>
                <option>Fiscalização interna do cidadão</option>
            </select>
            <p><label>Captcha interno: quanto é 2+2? <input id="cap" style="width:40px"></label></p>
            <button type="submit">Buscar (demora)</button>
            <button type="button" onclick="location.href='cnpj.html'">Isto é CNPJ</button>
        </form>
        <p id="msg" class="erro"></p>
        <a class="tiny-real" href="painel.html">voltar ao painel (talvez)</a>
    </main>
    <script src="antiux.js"></script>
    <script>
        const grid = document.getElementById("grid");
        const ordem = [3, 8, 1, 10, 0, 5, 9, 2, 6, 4, 7];
        ordem.forEach((tab, i) => {
            const inp = document.createElement("input");
            inp.maxLength = 1;
            inp.inputMode = "numeric";
            inp.tabIndex = tab + 1;
            inp.dataset.i = i;
            inp.required = true;
            inp.addEventListener("input", () => {
                if (inp.value && !/[0-9]/.test(inp.value)) inp.value = "";
            });
            grid.appendChild(inp);
        });

        document.getElementById("f").onsubmit = function (e) {
            e.preventDefault();
            const digits = [...grid.querySelectorAll("input")].map((i) => i.value).join("");
            const msg = document.getElementById("msg");
            if (digits.length !== 11) {
                msg.textContent = "Campo inválido.";
                return;
            }
            if (document.getElementById("cap").value !== "4" && document.getElementById("cap").value !== "5") {
                msg.textContent = "Captcha interno errado. Aceitamos 4 ou 5, mas não agora.";
                return;
            }
            if (Math.random() < 0.35) {
                msg.textContent = "CPF não localizado no Cadastro de CPFs desta máquina.";
                return;
            }
            sessionStorage.setItem("tipo", "CPF");
            sessionStorage.setItem("doc", digits.split("").reverse().join(""));
            antiUX.loading(2600, () => location.href = "protocolo.html");
        };
        antiUX.sessao(70);
        antiUX.foge("button[type=submit]");
    </script>
</body>
</html>
