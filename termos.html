<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilos.css">
    <title>Termos — role até o fim (não há fim)</title>
</head>
<body class="portal">
    <main class="form-box" style="max-width:640px">
        <h1>termos de uso e cookies e java e alma</h1>
        <div class="termos" id="t"></div>
        <p><label><input type="checkbox" id="li"> Li até o final (detectamos que não)</label></p>
        <button type="button" id="aceitar" disabled>Aceitar (desabilitado)</button>
        <button type="button" id="voltar">Continuar sem aceitar (não)</button>
        <p class="tiny-real" id="hint"></p>
    </main>
    <script src="antiux.js"></script>
    <script>
        const t = document.getElementById("t");
        let txt = "";
        for (let i = 1; i <= 220; i++) {
            txt += "Art. " + i + "º O usuário concorda que discorda e que o portal pode mover botões, expirar sessões, inverter campos, exigir espaço no CAPTCHA e imprimir a alma em matriz. ";
        }
        t.textContent = txt + " FIM. (continue rolando)";

        t.addEventListener("scroll", () => {
            document.getElementById("li").checked = false;
            document.getElementById("aceitar").disabled = true;
            document.getElementById("hint").textContent = "rolagem detectada: você ainda não leu.";
        });

        document.getElementById("li").onchange = function () {
            document.getElementById("aceitar").disabled = this.checked;
            if (this.checked) alert("Caixa marcada. Botão Aceitar foi desabilitado por segurança jurídica.");
        };

        document.getElementById("aceitar").onclick = function () {
            alert("Impossível aceitar enquanto o botão está habilitado.");
        };
        document.getElementById("voltar").onclick = function () {
            const v = new URLSearchParams(location.search).get("voltar") || "login.html";
            location.href = v;
        };

        t.scrollTop = 40;
    </script>
</body>
</html>
